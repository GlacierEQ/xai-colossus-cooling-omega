name: Cooling Omega Public Truth Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile bounded core
        run: python -m py_compile src/flow_controller.py tests/test_flow_controller.py scripts/verify_public_core.py
      - name: Verify bounded public core
        run: python scripts/verify_public_core.py
      - name: Verify public truth boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('README.md').read_text(encoding='utf-8')
          required = [
              'Independent portfolio project',
              'modeled_flow_control_policy',
              'hardware_actuation: false',
              'runtime_pairing_with_alpha: false',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'README truth boundary missing: {missing}')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cooling-omega-proof-py${{ matrix.python-version }}
          path: artifacts/public-core/verification.json
          if-no-files-found: error
